<html>
  <head>
    <title>Bekerja dengan gambar</title>
  </head>
  <body>
    <p>
      <!-- Menggunakan Path Relative -->
      <img src="bunga2.jpg" width="200" height="150">
      Vivamus elementum pretium tortor, ultrices porta erat hendrerit in.

    <p>
      <!-- Menggunakan Path Absolute -->
      <img src="img/bunga1.jpg" width="200" height="150" align="right">

      Curabitur varius nibh ac fringilla volutpat.
    </p>
  </body>
</html>
