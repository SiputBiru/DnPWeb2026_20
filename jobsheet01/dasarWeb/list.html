<html>
  <head>
    <title>Bekerja dengan List</title>
  </head>
  <body>
    Ordered List
    <ol>
      <li>Satu</li>
      <li>Dua</li>
      <li>Tiga</li>
    </ol>
    <br>
    <hr>
    Unordered List
    <ul>
      <li>Satu</li>
      <li>Dua</li>
      <li>Tiga</li>
    </ul>
    <br>
    <hr>
    Definition List
    <dl>
      <dt>Satu</dt>
      <dd>Satu adalah angka pertama dalam urutan bilangan</dd>
      <dt>Dua</dt>
      <dd>Dua adalah angka kedua dalam urutan bilangan</dd>
    </dl>
  </body>
</html>
